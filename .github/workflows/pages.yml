# Publish output-example/ to GitHub Pages.
# Runs only when something in output-example/ (or this file) changes on main,
# so the published site stays as it is until the example is updated.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Publish example pack

on:
  push:
    branches: [main]
    paths:
      - "output-example/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch: # manual re-publish from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: |
          set -euo pipefail
          mkdir -p _site
          # Publish only the rendered packs, not the JSON (it carries the
          # export's rules text).
          cp output-example/*-reference.html _site/ 2>/dev/null || true
          cp output-example/*-reference.pdf _site/ 2>/dev/null || true

          # Index page: one entry per pack, so adding a new example
          # (e.g. a local eval) shows up without editing anything.
          {
            echo '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width, initial-scale=1">'
            echo '<title>wh40k-lists: example reference packs</title>'
            echo '<style>body{font-family:"Helvetica Neue",Arial,sans-serif;max-width:720px;margin:40px auto;padding:0 16px;color:#111}'
            echo 'li{margin:8px 0}a{color:#0645ad}.pdf{font-size:.9em;margin-left:8px}</style></head><body>'
            echo '<h1>Example reference packs</h1>'
            echo '<p>Generated by the <a href="https://github.com/${{ github.repository }}">wh40k-datasheet-explainer</a> skill: game sequence, game plan, matchups, turn cheat sheet and unit cards.</p><ul>'
            for f in _site/*-reference.html; do
              [ -e "$f" ] || continue
              name=$(basename "$f" .html)
              title=$(sed -n 's:.*<title>\(.*\)</title>.*:\1:p' "$f" | head -1)
              echo "<li><a href=\"$name.html\">${title:-$name}</a>"
              [ -e "_site/$name.pdf" ] && echo "<a class=\"pdf\" href=\"$name.pdf\">(PDF)</a>"
              echo "</li>"
            done
            echo '</ul></body></html>'
          } > _site/index.html
          ls -la _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
