# Publish output-example/ to GitHub Pages.
# Runs only when something in output-example/ (or this file) changes on main,
# so the published site stays as it is until the example is updated.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Publish example pack

on:
  push:
    branches: [main]
    paths:
      - "output-example/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch: # manual re-publish from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Build site
        run: |
          set -euo pipefail
          mkdir -p _site
          # Publish only the rendered packs, not the JSON (it carries the
          # export's rules text).
          cp output-example/*-reference.html _site/ 2>/dev/null || true
          cp output-example/*-reference.pdf _site/ 2>/dev/null || true

          # Index page: one entry per pack, so adding a new example
          # (e.g. a local eval) shows up without editing anything.
          {
            echo '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width, initial-scale=1">'
            echo '<title>wh40k-lists: example reference packs</title>'
            echo '<style>'
            echo ':root{color-scheme:light dark;--fg:#111;--bg:#fff;--muted:#555;--line:#ccc;--btn:#0b57d0;--btn-fg:#fff}'
            echo '@media (prefers-color-scheme:dark){:root{--fg:#e8e8e8;--bg:#1b1c1e;--muted:#aaa;--line:#444;--btn:#7cacf8;--btn-fg:#111}}'
            echo 'body{font-family:"Helvetica Neue",Arial,sans-serif;max-width:720px;margin:40px auto;padding:0 16px;color:var(--fg);background:var(--bg)}'
            echo 'a{color:var(--btn)}p{line-height:1.45}'
            echo '.pack{border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin:14px 0}'
            echo '.pack h2{margin:0 0 10px;font-size:1.25em}.links{display:flex;gap:10px;flex-wrap:wrap}'
            echo '.btn{display:inline-block;padding:7px 14px;border-radius:6px;text-decoration:none;font-weight:600;border:2px solid var(--btn)}'
            echo '.btn.primary{background:var(--btn);color:var(--btn-fg)}.btn.secondary{color:var(--btn)}'
            echo '.size{font-weight:400;opacity:.75}</style></head><body>'
            echo '<h1>Example reference packs</h1>'
            echo '<p>Generated by the <a href="https://github.com/${{ github.repository }}">wh40k-datasheet-explainer</a> skill: game sequence, game plan, matchups, turn cheat sheet and unit cards.</p>'
            echo '<p style="color:var(--muted)">Each pack comes in two versions with the same content: a web page to read in your browser, and a PDF laid out for printing.</p>'
            for f in _site/*-reference.html; do
              [ -e "$f" ] || continue
              name=$(basename "$f" .html)
              title=$(sed -n 's:.*<title>\(.*\)</title>.*:\1:p' "$f" | head -1)
              echo "<div class=\"pack\"><h2>${title:-$name}</h2><div class=\"links\">"
              echo "<a class=\"btn primary\" href=\"$name.html\">View in browser</a>"
              if [ -e "_site/$name.pdf" ]; then
                kb=$(( ($(wc -c < "_site/$name.pdf") + 1023) / 1024 ))
                echo "<a class=\"btn secondary\" href=\"$name.pdf\">Printable PDF <span class=\"size\">· ${kb} KB</span></a>"
              fi
              echo "</div></div>"
            done
            echo '</body></html>'
          } > _site/index.html
          ls -la _site

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
